# DigitalOcean Configuration for CHEESE MAIN NODE
# Primary node with GOVERNANCE + HYBRID capabilities
# Hosts all 27 AI models and full blockchain functionality
# Main domain: cheeseblockchain.com

services:
  - type: web
    name: cheese-main-node
    env: node
    repo: https://github.com/cryptoexdevcheese/cheese-blockchain
    branch: master
    buildCommand: npm install
    startCommand: node start-server.js
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_TYPE
        value: hybrid # Full capability: Mining + Governance + DEX + Wallet
      - key: NODE_ROLE
        value: HYBRID # For API endpoint compatibility
      - key: API_KEY
        value: bd1d57cfa96f8595684d823fe9aada5304495959aa27e02f16a16fbfd6b9623b
      - key: PORT
        value: 8080
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false # Set Firebase service account JSON for database access

    # DigitalOcean droplet configuration
    # Region: Singapore (sgp1)
    # Resources: 1GB RAM, 1 vCPU (can be upgraded)
    # IP: 165.22.252.113

