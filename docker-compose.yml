version: '3.8'

services:
  # Python AI Service
  ai-service:
    build: ./ai-service
    ports:
      - "5000:5000"
    environment:
      - AI_SERVICE_PORT=5000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./ai-service/models:/app/models
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node.js Blockchain (optional, can run separately)
  blockchain:
    build: .
    ports:
      - "3000:3000"
    environment:
      - AI_SERVICE_URL=http://ai-service:5000
      - NODE_ENV=production
    depends_on:
      - ai-service
    restart: unless-stopped

networks:
  default:
    name: cheese-network
